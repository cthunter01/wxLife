# Builds and tests the CI presets on Linux, macOS and Windows, and checks formatting.
# Linux runs in an Arch Linux container so CI has the same current GCC/Clang as the dev machine.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc, ci-clang, asan, tidy]
    steps:
      # gtk3 (and its zlib, libpng, expat and pcre2) for the static wxWidgets build; libsm for its X11 session
      # support. There is no display, so the GUI smoke tests skip themselves.
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed cmake ninja clang git gtk3 libsm
      - uses: actions/checkout@v7
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # Apple Clang from the runner's default Xcode; wxWidgets is built for Cocoa with nothing else installed.
  # No asan here: the Linux asan job sanitizes the same code, and Linux also has leak detection, which Apple's
  # AddressSanitizer runtime lacks. The asan preset itself still works on a Mac for local use.
  macos:
    name: macos / ${{ matrix.preset }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-clang]
    steps:
      - name: Install Ninja
        run: brew install ninja
      - uses: actions/checkout@v7
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # MSVC from the runner's Visual Studio; msvc-dev-cmd sets up the Developer PowerShell environment (which
  # also puts dumpbin, used by the static_link test, on PATH). wxWidgets builds its bundled zlib, libpng,
  # expat and PCRE2.
  windows:
    name: windows / ci-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure, build and test
        run: cmake --workflow --preset ci-msvc

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
